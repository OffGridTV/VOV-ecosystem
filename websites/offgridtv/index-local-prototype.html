<body>
    <main class="page" aria-label="OFF GRID local prototype">
        <section class="hero" aria-label="OFF GRID hero">
            <div class="hero-lockup">
                <h1 class="wordmark" aria-label="OFF GRID wordmark">
                    <span class="word">OFF</span>
                    <span class="separator" aria-hidden="true">&middot;</span>

        </section>

                <img class="bookend-logo" src="assets/EVAI%20Logo.svg" alt="EVAI logo" width="280" height="105" decoding="async">
